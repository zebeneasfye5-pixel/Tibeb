<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e180d"/>
      <stop offset="60%" stop-color="#0f0c07"/>
      <stop offset="100%" stop-color="#060503"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#b45309" stroke-width="6"/>

  <!-- Celestial Outer Orbit (Abushakir Calendar & Awde Negest Zodiac) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  
  <!-- 12 Zodiac / Months Markers around circle -->
  <g stroke="url(#goldGrad)" stroke-width="2">
    <line x1="256" y1="46" x2="256" y2="70"/>
    <line x1="256" y1="442" x2="256" y2="466"/>
    <line x1="46" y1="256" x2="70" y2="256"/>
    <line x1="442" y1="256" x2="466" y2="256"/>
    <line x1="108" y1="108" x2="124" y2="124"/>
    <line x1="404" y1="404" x2="388" y2="388"/>
    <line x1="404" y1="108" x2="388" y2="124"/>
    <line x1="108" y1="404" x2="124" y2="388"/>
    <line x1="361" y1="74" x2="349" y2="95"/>
    <line x1="151" y1="438" x2="163" y2="417"/>
    <line x1="438" y1="151" x2="417" y2="163"/>
    <line x1="74" y1="361" x2="95" y2="349"/>
  </g>

  <!-- Traditional Ethiopian Cross (Lalibela Style Intricate Geometry) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Solar Diamond -->
    <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="url(#goldGrad)" stroke-width="6" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="18" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="8" fill="#991b1b"/>

    <!-- Top Arm -->
    <path d="M-18 -35 L-18 -110 L-40 -110 L-40 -140 L0 -170 L40 -140 L40 -110 L18 -110 L18 -35 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="-100" r="10" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-140" r="6" fill="#b45309"/>

    <!-- Bottom Arm -->
    <path d="M-18 35 L-18 110 L-40 110 L-40 140 L0 170 L40 140 L40 110 L18 110 L18 35 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="100" r="10" fill="url(#goldGrad)"/>
    <circle cx="0" cy="140" r="6" fill="#b45309"/>

    <!-- Left Arm -->
    <path d="M-35 -18 L-110 -18 L-110 -40 L-140 -40 L-170 0 L-140 40 L-110 40 L-110 18 L-35 18 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="-100" cy="0" r="10" fill="url(#goldGrad)"/>
    <circle cx="-140" cy="0" r="6" fill="#b45309"/>

    <!-- Right Arm -->
    <path d="M35 -18 L110 -18 L110 -40 L140 -40 L170 0 L140 40 L110 40 L110 18 L35 18 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="100" cy="0" r="10" fill="url(#goldGrad)"/>
    <circle cx="140" cy="0" r="6" fill="#b45309"/>

    <!-- 4 Diagonal Radiant Stars -->
    <g fill="url(#goldGrad)">
      <polygon points="70,-70 85,-85 70,-100 55,-85" />
      <polygon points="-70,-70 -85,-85 -70,-100 -55,-85" />
      <polygon points="70,70 85,85 70,100 55,85" />
      <polygon points="-70,70 -85,85 -70,100 -55,85" />
    </g>
  </g>

  <!-- Title Ribbon Banner at bottom -->
  <rect x="106" y="420" width="300" height="42" rx="8" fill="#18130c" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="256" y="448" font-family="'Noto Sans Ethiopic', 'Nyala', 'Abyssinica SIL', sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">
    ጥንተ ጥበብ
  </text>
</svg>
